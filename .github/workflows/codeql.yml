name: CodeQL Security Scan

on:
  schedule:
    - cron: '17 3 * * 0'
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  analyze:
    name: CodeQL Analysis (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'java'

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy `tools` package; default install would fail CI.
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Download ByeDPI native binaries
        run: ./gradlew :engine-byedpi:downloadBinaries --stacktrace

      - name: Prepare URnetwork AAR
        uses: ./.github/actions/prepare-urnetwork

      - name: Download and explode Singbox AAR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBBOX_AAR_SHA256: 7a5fa900e73352a18d55ef7ae55427e3e60ba7208b5848ccf64ec5acdf154867
        run: |
          set -euo pipefail
          TMPAAR=/tmp/libbox.aar
          gh release download singbox-1.13.12 -p "libbox.aar" -D /tmp --clobber
          echo "$LIBBOX_AAR_SHA256  $TMPAAR" | sha256sum -c -
          mkdir -p singbox-core/libs singbox-core/libs-stubs /tmp/go-stubs
          unzip -o "$TMPAAR" classes.jar -d /tmp
          cp /tmp/classes.jar singbox-core/libs/libbox.jar
          unzip -o /tmp/classes.jar 'go/*.class' -d /tmp/go-stubs 2>/dev/null || true
          jar cf singbox-core/libs-stubs/go-stubs.jar -C /tmp/go-stubs . 2>/dev/null || true
          python3 scripts/patch-go-seq.py singbox-core/libs-stubs/go-stubs.jar
          zip -d singbox-core/libs/libbox.jar 'go/*.class' || true
          mkdir -p singbox-core/src/main/jniLibs
          unzip -o "$TMPAAR" 'jni/*' -d /tmp/aar-exploded || true
          if [ -d /tmp/aar-exploded/jni ]; then
            cp -r /tmp/aar-exploded/jni/* singbox-core/src/main/jniLibs/
          fi

      - name: Build MASQUE native transport
        uses: ./.github/actions/build-masque

      - name: Build for CodeQL analysis
        run: ./gradlew assembleDebug --no-daemon

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results
          upload: ${{ !github.event.repository.private || vars.CODE_SCANNING_ENABLED == 'true' }}

      - name: Preserve CodeQL report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: codeql-results
          path: codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 30
