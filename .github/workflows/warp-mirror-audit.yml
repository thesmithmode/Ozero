name: WARP mirror audit

on:
  push:
    branches: [feature-warp-mirror-audit]
    paths:
      - '.github/workflows/warp-mirror-audit.yml'
      - 'tools/warp-mirror-audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Probe each WARP registration endpoint
        run: python tools/warp-mirror-audit.py
      - name: Upload status-only report
        uses: actions/upload-artifact@v6
        with:
          name: warp-mirror-audit-${{ matrix.os }}
          path: warp-mirror-audit.json
          retention-days: 7
