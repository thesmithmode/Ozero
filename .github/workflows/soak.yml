name: Sing-box Android Soak

on:
  workflow_dispatch:
    inputs:
      cycles-per-protocol:
        description: 'Connect/disconnect cycles for VLESS, VLESS Reality, VMess and Trojan'
        required: false
        default: '20'
      api-level:
        description: 'ARM64 Android emulator API level'
        required: false
        default: '30'
  push:
    branches: [dev]
    paths:
      - '.github/soak/**'
      - '.github/scripts/**'
      - '.github/workflows/soak.yml'
      - 'app/**'
      - 'common-vpn/**'
      - 'engine-singbox/**'
      - 'singbox-*/**'

concurrency:
  group: singbox-android-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    name: ARM64 TUN — ${{ matrix.name }}
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: VLESS, VMess, Trojan
            require_reality: '0'
            expected_protocols: 'vless,vmess,trojan'
          - name: VLESS Reality
            require_reality: '1'
            expected_protocols: 'vless_reality'
    permissions:
      contents: read
    env:
      SINGBOX_VERSION: '1.13.12'
      SINGBOX_SERVER_ARCHIVE_SHA256: '43eef86f0ea4a79c3696974f397a963c46a457ee46d1ffac9aa913944a5fc986'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve URnetwork SDK release
        id: urnetwork-aar-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release list --limit 100 --json tagName \
            | grep -oE '"urnetwork-sdk-[a-f0-9]{8}"' \
            | head -n1 | tr -d '"')
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore URnetwork SDK
        id: urnetwork-aar-cache
        uses: actions/cache@v6
        with:
          path: engine-urnetwork/libs
          key: urnetwork-aar-${{ steps.urnetwork-aar-tag.outputs.tag }}-go-stripped-v1

      - name: Prepare URnetwork SDK
        if: steps.urnetwork-aar-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p engine-urnetwork/libs
          gh release download "${{ steps.urnetwork-aar-tag.outputs.tag }}" -p '*' -D engine-urnetwork/libs --clobber
          for aar in engine-urnetwork/libs/*.aar; do
            test -f "$aar"
            tmpdir=$(mktemp -d)
            unzip -o "$aar" -d "$tmpdir/aar-exploded"
            zip -d "$tmpdir/aar-exploded/classes.jar" 'go/*.class' 2>/dev/null || true
            (cd "$tmpdir/aar-exploded" && zip -r9 "$GITHUB_WORKSPACE/$aar" .)
          done

      - name: Restore verified libbox
        id: singbox-aar-cache
        uses: actions/cache@v6
        with:
          path: |
            singbox-core/libs
            singbox-core/libs-stubs
            singbox-core/src/main/jniLibs
          key: singbox-libbox-1.13.12-exploded-v7-sha256-7a5fa900e73352a18d55ef7ae55427e3e60ba7208b5848ccf64ec5acdf154867

      - name: Prepare verified libbox
        if: steps.singbox-aar-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp_aar="$RUNNER_TEMP/libbox.aar"
          gh release download singbox-1.13.12 -p 'libbox.aar' -D "$RUNNER_TEMP" --clobber -R "${{ github.repository }}"
          .github/scripts/verify-libbox-aar.sh "$tmp_aar" '1.13.12'
          mkdir -p singbox-core/libs singbox-core/libs-stubs "$RUNNER_TEMP/go-stubs" "$RUNNER_TEMP/aar-exploded"
          unzip -o "$tmp_aar" classes.jar -d "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/classes.jar" singbox-core/libs/libbox.jar
          unzip -o "$RUNNER_TEMP/classes.jar" 'go/*.class' -d "$RUNNER_TEMP/go-stubs" 2>/dev/null || true
          jar cf singbox-core/libs-stubs/go-stubs.jar -C "$RUNNER_TEMP/go-stubs" . 2>/dev/null || true
          python3 scripts/patch-go-seq.py singbox-core/libs-stubs/go-stubs.jar
          zip -d singbox-core/libs/libbox.jar 'go/*.class' || true
          mkdir -p singbox-core/src/main/jniLibs
          unzip -o "$tmp_aar" 'jni/*' -d "$RUNNER_TEMP/aar-exploded" || true
          cp -R "$RUNNER_TEMP/aar-exploded/jni/." singbox-core/src/main/jniLibs/

      - name: Verify ARM64 libbox input
        run: |
          set -euo pipefail
          test -s singbox-core/libs/libbox.jar
          test -s singbox-core/src/main/jniLibs/arm64-v8a/libbox.so

      - name: Require private Reality soak secrets
        if: matrix.require_reality == '1'
        env:
          OZERO_SOAK_REALITY_URI: ${{ secrets.OZERO_SOAK_REALITY_URI }}
          OZERO_SOAK_REALITY_TARGET: ${{ secrets.OZERO_SOAK_REALITY_TARGET }}
          OZERO_SOAK_REALITY_MARKER: ${{ secrets.OZERO_SOAK_REALITY_MARKER }}
          OZERO_SOAK_REALITY_HITS_URL: ${{ secrets.OZERO_SOAK_REALITY_HITS_URL }}
        run: |
          set -euo pipefail
          for name in OZERO_SOAK_REALITY_URI OZERO_SOAK_REALITY_TARGET OZERO_SOAK_REALITY_MARKER OZERO_SOAK_REALITY_HITS_URL; do
            test -n "${!name}" || { echo "::error::$name is required for the private Reality soak"; exit 1; }
          done

      - name: Start ephemeral protocol servers
        run: |
          set -euo pipefail
          vless_uuid=$(uuidgen | tr '[:upper:]' '[:lower:]')
          vmess_uuid=$(uuidgen | tr '[:upper:]' '[:lower:]')
          trojan_password=$(openssl rand -hex 24)
          echo "OZERO_SOAK_VLESS_UUID=$vless_uuid" >> "$GITHUB_ENV"
          echo "OZERO_SOAK_VMESS_UUID=$vmess_uuid" >> "$GITHUB_ENV"
          echo "OZERO_SOAK_TROJAN_PASSWORD=$trojan_password" >> "$GITHUB_ENV"
          OZERO_SOAK_VLESS_UUID="$vless_uuid" \
            OZERO_SOAK_VMESS_UUID="$vmess_uuid" \
            OZERO_SOAK_TROJAN_PASSWORD="$trojan_password" \
            python3 - <<'PY'
          import os
          from pathlib import Path
          from string import Template

          source = Path('.github/soak/sing-box-server.json')
          target = Path(os.environ['RUNNER_TEMP']) / 'sing-box-server.json'
          target.write_text(Template(source.read_text()).substitute(os.environ), encoding='utf-8')
          PY
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout .github/soak/server-key.pem \
            -out .github/soak/server-cert.pem \
            -days 1 \
            -subj '/CN=localhost'
          archive="$RUNNER_TEMP/sing-box.tar.gz"
          url="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-darwin-arm64.tar.gz"
          curl --fail --location --retry 3 "$url" --output "$archive"
          echo "${SINGBOX_SERVER_ARCHIVE_SHA256}  $archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          binary="$RUNNER_TEMP/sing-box-${SINGBOX_VERSION}-darwin-arm64/sing-box"
          "$binary" check -c "$RUNNER_TEMP/sing-box-server.json"
          "$binary" run -c "$RUNNER_TEMP/sing-box-server.json" > "$RUNNER_TEMP/singbox-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/singbox-server.pid"

          mkdir -p "$RUNNER_TEMP/soak-http"
          printf 'ozero-singbox-routed\n' > "$RUNNER_TEMP/soak-http/ozero-soak-marker"
          cat > "$RUNNER_TEMP/soak-http/subscription-v1.txt" <<EOF
          vless://$vless_uuid@10.0.2.2:18081?security=none&type=tcp#VLESS%20subscription
          vmess://$vmess_uuid@10.0.2.2:18082?security=none&type=tcp&encryption=auto#VMess%20subscription
          trojan://$trojan_password@10.0.2.2:18083?security=tls&sni=localhost&allowInsecure=1&type=tcp#Trojan%20subscription
          vless://$vless_uuid@10.0.2.2:18081?security=none&type=xhttp#Unsupported%20transport
          EOF
          cat > "$RUNNER_TEMP/soak-http/subscription-v2.txt" <<EOF
          vless://$vless_uuid@10.0.2.2:18081?security=none&type=tcp#VLESS%20refreshed
          vmess://$vmess_uuid@10.0.2.2:18082?security=none&type=tcp&encryption=auto#VMess%20subscription
          trojan://$trojan_password@10.0.2.2:18083?security=tls&sni=localhost&allowInsecure=1&type=tcp#Trojan%20subscription
          vless://$vless_uuid@10.0.2.2:18081?security=none&type=xhttp#Unsupported%20transport
          EOF
          python3 .github/soak/subscription-server.py \
            --directory "$RUNNER_TEMP/soak-http" \
            --port 18080 > "$RUNNER_TEMP/soak-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/soak-http.pid"
          for port in 18080 18081 18082 18083; do
            for attempt in {1..30}; do
              nc -z 127.0.0.1 "$port" && break
              sleep 1
            done
            nc -z 127.0.0.1 "$port"
          done

      - name: Build ARM64 debug and instrumentation APKs
        run: |
          set -euo pipefail
          ./gradlew :engine-byedpi:downloadBinaries --stacktrace
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --continue

      - name: Resolve soak parameters
        env:
          CYCLES_INPUT: ${{ inputs['cycles-per-protocol'] }}
        run: |
          set -euo pipefail
          cycles="${CYCLES_INPUT:-5}"
          [[ "$cycles" =~ ^[0-9]+$ ]] && (( cycles >= 1 && cycles <= 100 ))
          echo "SOAK_CYCLES=$cycles" >> "$GITHUB_ENV"

      - name: Run real Sing-box TUN soak
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OZERO_SOAK_REALITY_URI: ${{ secrets.OZERO_SOAK_REALITY_URI }}
          OZERO_SOAK_REALITY_TARGET: ${{ secrets.OZERO_SOAK_REALITY_TARGET }}
          OZERO_SOAK_REALITY_MARKER: ${{ secrets.OZERO_SOAK_REALITY_MARKER }}
          OZERO_SOAK_REALITY_HITS_URL: ${{ secrets.OZERO_SOAK_REALITY_HITS_URL }}
        with:
          api-level: ${{ inputs['api-level'] || '30' }}
          arch: arm64-v8a
          profile: Nexus 6
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell appops set ru.ozero.app ACTIVATE_VPN allow
            adb logcat -c
            status=0
            adb shell am instrument \
              -w \
              -e OZERO_SOAK 1 \
              -e OZERO_SOAK_CYCLES "$SOAK_CYCLES" \
              -e OZERO_SOAK_REQUIRE_REALITY "${{ matrix.require_reality }}" \
              -e OZERO_SOAK_REALITY_ONLY "${{ matrix.require_reality }}" \
              -e OZERO_SOAK_VLESS_REALITY "$OZERO_SOAK_REALITY_URI" \
              -e OZERO_SOAK_REALITY_TARGET "$OZERO_SOAK_REALITY_TARGET" \
              -e OZERO_SOAK_REALITY_MARKER "$OZERO_SOAK_REALITY_MARKER" \
              -e class ru.ozero.app.soak.SoakTest \
              ru.ozero.app.test/androidx.test.runner.AndroidJUnitRunner \
              | tee "$RUNNER_TEMP/soak-output.txt" || status=$?
            adb logcat -d > "$RUNNER_TEMP/soak-logcat.txt"
            if grep -E -q 'FATAL EXCEPTION|Fatal signal|DeadObjectException' "$RUNNER_TEMP/soak-logcat.txt"; then
              status=1
            fi
            if [[ "${{ matrix.require_reality }}" == '0' ]]; then
              grep -E -q 'SingboxEngine.*autoCount=3' "$RUNNER_TEMP/soak-logcat.txt" || status=1
            fi
            adb pull /sdcard/Android/data/ru.ozero.app/files/soak-metrics.json soak-metrics.json || status=1
            test -s soak-metrics.json || status=1
            grep -q 'OK (1 test)' "$RUNNER_TEMP/soak-output.txt" || status=1
            SOAK_EXPECTED_CYCLES="$SOAK_CYCLES" SOAK_EXPECTED_PROTOCOLS="${{ matrix.expected_protocols }}" python3 -c 'import json, os; data=json.load(open("soak-metrics.json", encoding="utf-8")); expected=int(os.environ["SOAK_EXPECTED_CYCLES"]); protocols=os.environ["SOAK_EXPECTED_PROTOCOLS"].split(","); actual=data["successful_cycles"]; assert data["cycles_per_protocol"] == expected; assert set(actual) == set(protocols); assert all(actual[name] == expected for name in protocols)' || status=1
            IFS=, read -ra protocols <<< "${{ matrix.expected_protocols }}"
            for protocol in "${protocols[@]}"; do
              hits=$(grep -Ec "\\[${protocol}-in\\].*inbound connection" "$RUNNER_TEMP/singbox-server.log" || true)
              if [[ "$protocol" != "vless_reality" ]]; then
                (( hits >= SOAK_CYCLES )) || status=1
              fi
            done
            if [[ "${{ matrix.require_reality }}" == '1' ]]; then
              reality_hits=$(curl --fail --silent --show-error --max-time 15 "$OZERO_SOAK_REALITY_HITS_URL" | tr -d '[:space:]') || status=1
              [[ "$reality_hits" =~ ^[0-9]+$ ]] && (( reality_hits >= SOAK_CYCLES )) || status=1
            fi
            exit "$status"

      - name: Write job summary
        if: always()
        run: |
          echo '## Sing-box ARM64 TUN soak' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -s soak-metrics.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat soak-metrics.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Metrics were not produced; soak is failed.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect server log
        if: always()
        run: |
          cp "$RUNNER_TEMP/singbox-server.log" singbox-server.log 2>/dev/null || true
          cp "$RUNNER_TEMP/soak-http.log" soak-http.log 2>/dev/null || true

      - name: Upload soak evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: singbox-arm64-soak-evidence
          path: |
            soak-metrics.json
            ${{ runner.temp }}/soak-output.txt
            ${{ runner.temp }}/soak-logcat.txt
            singbox-server.log
            soak-http.log
          if-no-files-found: warn
          retention-days: 30
