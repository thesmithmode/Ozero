name: Apply PR 434 review fixes

"on":
  push:
    branches:
      - codex/-ozero

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: codex/-ozero
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Apply exact fixes
        run: |
          sed -i 's/validProfile(id, latency = (100 + id).toInt())/makeProfile(id, \\\"batch-$id.example\\\", 443)/g' .github/scripts/pr434_apply_fixes.py
          python3 - <<'PY'
          from pathlib import Path
          script = Path('.github/scripts/pr434_apply_fixes.py')
          text = script.read_text()
          start = text.index('marker = "override suspend fun attachTun(tunFd: Int): TunAttachResult"')
          replacement = '''p = Path("engine-singbox/src/main/java/ru/ozero/enginesingbox/SingboxEngine.kt")
          text = p.read_text()
          marker = "override suspend fun attachTun(tunFd: Int): TunAttachResult"
          marker_pos = text.index(marker)
          old = 'TunAttachResult.Failure("AIDL failed")'
          failure_pos = text.find(old, marker_pos)
          if failure_pos < 0:
              raise SystemExit(f"missing attachTun generic AIDL failure in {p}")
          new = 'TunAttachResult.Failure("AIDL failed (${it::class.java.simpleName})")'
          p.write_text(text[:failure_pos] + new + text[failure_pos + len(old):])
          print(f"updated attachTun diagnostics in {p}")
          '''
          script.write_text(text[:start] + replacement)
          PY
          python3 .github/scripts/pr434_apply_fixes.py
          git diff --check
          git diff --stat

      - name: Run dependency-independent targeted tests
        run: ./gradlew :singbox-config:testDebugUnitTest :singbox-subscription:testDebugUnitTest --no-daemon

      - name: Commit fixes and clean temporary files
        run: |
          git checkout b9c8f5d66b6fe9a3ddbd2bd52d9ebef815fe1caf -- .github/workflows/gradle-wrapper-validation.yml
          rm -f .github/workflows/codex-pr434-review-fixes.yml
          rm -f .github/scripts/pr434_apply_fixes.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(singbox): address remaining PR 434 findings"
          git push origin HEAD:codex/-ozero
