name: Apply PR 434 detekt fix

"on":
  push:
    branches:
      - codex/-ozero

permissions:
  contents: write

jobs:
  apply-detekt-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: codex/-ozero
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply structural refactor
        run: |
          python3 .github/scripts/pr434_detekt_fix.py
          git diff --check

      - name: Run app style checks
        run: ./gradlew :app:ktlintCheck :app:detekt --no-daemon

      - name: Commit source fix and clean runner
        run: |
          git checkout 125744f5aa89d1ae6d7ba3ac0cc03026d9dfc1ac -- .github/workflows/gradle-wrapper-validation.yml
          rm -f .github/scripts/pr434_detekt_fix.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(singbox): flatten probe orchestration"
          git push origin HEAD:codex/-ozero
