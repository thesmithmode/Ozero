name: Adaptive VPN diagnostic (ARM64 APK under native bridge)

on:
  push:
    branches: [fix/auto-restart-budget]
    paths: ['.github/workflows/adaptive-vpn-diagnostic.yml']
permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy `tools` package; default install would fail CI.
          packages: 'platform-tools'

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare URnetwork AAR
        uses: ./.github/actions/prepare-urnetwork

      - name: Restore verified libbox
        id: singbox-aar-cache
        uses: actions/cache@v6
        with:
          path: |
            singbox-core/libs
            singbox-core/libs-stubs
            singbox-core/src/main/jniLibs
          key: singbox-libbox-1.13.12-exploded-v7-sha256-7a5fa900e73352a18d55ef7ae55427e3e60ba7208b5848ccf64ec5acdf154867

      - name: Prepare verified libbox
        if: steps.singbox-aar-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp_aar="$RUNNER_TEMP/libbox.aar"
          .github/scripts/download-libbox-aar.sh "$tmp_aar" '1.13.12'
          .github/scripts/verify-libbox-aar.sh "$tmp_aar" '1.13.12'
          mkdir -p singbox-core/libs singbox-core/libs-stubs "$RUNNER_TEMP/go-stubs" "$RUNNER_TEMP/aar-exploded"
          unzip -o "$tmp_aar" classes.jar -d "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/classes.jar" singbox-core/libs/libbox.jar
          unzip -o "$RUNNER_TEMP/classes.jar" 'go/*.class' -d "$RUNNER_TEMP/go-stubs" 2>/dev/null || true
          jar cf singbox-core/libs-stubs/go-stubs.jar -C "$RUNNER_TEMP/go-stubs" . 2>/dev/null || true
          python3 scripts/patch-go-seq.py singbox-core/libs-stubs/go-stubs.jar
          zip -d singbox-core/libs/libbox.jar 'go/*.class' || true
          mkdir -p singbox-core/src/main/jniLibs
          unzip -o "$tmp_aar" 'jni/*' -d "$RUNNER_TEMP/aar-exploded" || true
          cp -R "$RUNNER_TEMP/aar-exploded/jni/." singbox-core/src/main/jniLibs/

      - name: Verify ARM64 libbox input
        run: |
          set -euo pipefail
          test -s singbox-core/libs/libbox.jar
          test -s singbox-core/src/main/jniLibs/arm64-v8a/libbox.so

      - name: Build libhev for arm64-v8a soak APK
        env:
          NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
          HEV_REPO: https://github.com/heiher/hev-socks5-tunnel.git
          HEV_COMMIT_SHA: 54eab54ab4e6e9a708229a89a05578e52074fc6f
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/hev-socks5-tunnel"
          OUT="common-vpn/src/main/jniLibs/arm64-v8a"
          git init "$SRC"
          git -C "$SRC" remote add origin "$HEV_REPO"
          git -C "$SRC" fetch --no-tags --depth 1 origin "$HEV_COMMIT_SHA"
          git -C "$SRC" checkout --detach FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "$HEV_COMMIT_SHA"
          git -C "$SRC" submodule update --init --recursive --depth 1
          cd "$SRC"
          "$NDK_PATH/ndk-build" \
            NDK_PROJECT_PATH="$SRC" \
            APP_BUILD_SCRIPT="$SRC/Android.mk" \
            NDK_APPLICATION_MK="$SRC/Application.mk" \
            APP_ABI="arm64-v8a" \
            APP_PLATFORM=android-24 \
            APP_CFLAGS="-DPKGNAME=hev" \
            -j"$(nproc)"
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$OUT"
          cp "$SRC/libs/arm64-v8a/libhev-socks5-tunnel.so" "$OUT/libhev-ozero-socks5-tunnel.so"
          test -s "$OUT/libhev-ozero-socks5-tunnel.so"

      - name: Build MASQUE native transport
        uses: ./.github/actions/build-masque
        with:
          ndk-path: ${{ steps.ndk.outputs.ndk-path }}

      - name: Build ARM64-only debug APK and instrumentation APK
        run: |
          set -euo pipefail
          ./gradlew :engine-byedpi:downloadBinaries --stacktrace
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          APK=app/build/outputs/apk/debug/app-debug.apk
          python3 engine-gfvpn/verify-bundled-sdk.py "$APK"
          bash scripts/verify-gfvpn-hev-apk.sh "$APK"
          unzip -Z1 "$APK" | awk '/^lib\// && $0 !~ /^lib\/arm64-v8a\// { invalid=1 } END { exit invalid }'

      - name: Run real SDK and external UID VPN probes (translated ARM64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -eu
            adb shell getprop ro.product.cpu.abilist64 | tr -d '\r' | grep -E '(^|,)arm64-v8a(,|$)'
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell dumpsys package ru.ozero.app | grep -E 'primaryCpuAbi=arm64-v8a'
            adb shell appops set ru.ozero.app ACTIVATE_VPN allow
            adb logcat -c
            status=0
            timeout 2200s bash engine-gfvpn/device-smoke.sh > "$RUNNER_TEMP/adaptive-diagnostic.txt" 2>&1 || status=$?
            count=$(tr -d '\r' < "$RUNNER_TEMP/adaptive-diagnostic.txt" | grep -Fxc 'OK (1 test)' || true)
            echo "Successful test suites: $count of 2; exit status: $status"
            if [ "$status" -ne 0 ] || [ "$count" -ne 2 ]; then
              echo 'ARM64 translated SDK/TUN check failed; reporting only fixed diagnostic categories.'
              grep -Eo 'java\.(lang|io|util\.concurrent)\.[A-Za-z]+(Exception|Error)|LOAD_SDK|CONFIGURE|NATIVE_START|VALIDATE_SESSION|ARM64 device required|Bundled gfVPN SDK is absent|VPN consent not granted|gfVPN process disconnected|gfVPN verification startup timed out|SDK startup failed|TUN health probe succeeded without an attached descriptor|external routed HTTP failed|external probe is outside the VPN' "$RUNNER_TEMP/adaptive-diagnostic.txt" | sort -u || true
              adb logcat -d -s GfVpnSdk:W GfVpnProcess:W GfVpnRuntime:W | grep -Eo '(LOAD_SDK|CONFIGURE|NATIVE_START|VALIDATE_SESSION): [A-Za-z]+(Exception|Error)|[a-z-]+ watchdog expired|[a-z-]+ failed: [A-Za-z]+(Exception|Error)' | sort -u || true
              exit 1
            fi
            echo 'Real SDK and three routed external UID TUN cycles passed on ARM64 translation.'
