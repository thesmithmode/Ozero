name: Build FPTN transport
description: Build the pinned protocol library and install it for Android packaging
runs:
  using: composite
  steps:
    - name: Build native toolchain
      shell: bash
      run: docker build -t ozero-fptn -f build-tools/Dockerfile.fptn build-tools/
    - name: Build pinned transport
      shell: bash
      run: |
        docker run --rm \
          -v "$PWD:/src" \
          -w /src \
          -e REPO_ROOT=/src \
          -e OUT_DIR=/src/out/fptn \
          ozero-fptn \
          bash build-tools/build_fptn.sh
        sudo chown -R "$(id -u):$(id -g)" out engine-fptn/src/main/cpp/libs build
        mkdir -p engine-fptn/src/main/jniLibs/arm64-v8a
        cp out/fptn/libfptn_native_lib-arm64-v8a.so engine-fptn/src/main/jniLibs/arm64-v8a/libfptn_native_lib.so
