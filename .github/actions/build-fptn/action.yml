name: Build FPTN transport
description: Build the pinned protocol library and install it for Android packaging
runs:
  using: composite
  steps:
    - name: Restore pinned native library
      id: native-cache
      uses: actions/cache/restore@v6
      with:
        path: out/fptn
        key: fptn-native-${{ runner.os }}-${{ hashFiles('build-tools/Dockerfile.fptn', 'build-tools/build_fptn.sh', 'engine-fptn/src/main/cpp/**', '.github/actions/build-fptn/action.yml') }}
    - name: Reserve disk space for cold native compilation
      if: steps.native-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        df -h "$GITHUB_WORKSPACE"
        sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
        docker system prune --all --force
        AVAILABLE_KB=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
        if [ "$AVAILABLE_KB" -lt 20971520 ]; then
          echo "::error::Cold FPTN compilation requires at least 20 GiB of free disk space"
          exit 1
        fi
        df -h "$GITHUB_WORKSPACE"
    - name: Build native toolchain
      if: steps.native-cache.outputs.cache-hit != 'true'
      shell: bash
      run: docker build -t ozero-fptn -f build-tools/Dockerfile.fptn build-tools/
    - name: Build pinned transport
      if: steps.native-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        docker run --rm \
          -v "$PWD:/src" \
          -w /src \
          -e REPO_ROOT=/src \
          -e OUT_DIR=/src/out/fptn \
          ozero-fptn \
          bash build-tools/build_fptn.sh
        sudo chown -R "$(id -u):$(id -g)" out engine-fptn/src/main/cpp/libs build
    - name: Release native build storage before APK assembly
      if: steps.native-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        rm -rf build/fptn-arm64-v8a build/fptn-android-src
        docker image rm ozero-fptn
        docker builder prune --all --force
        df -h "$GITHUB_WORKSPACE"
    - name: Install pinned native library
      shell: bash
      run: |
        mkdir -p engine-fptn/src/main/jniLibs/arm64-v8a
        cp out/fptn/libfptn_native_lib-arm64-v8a.so engine-fptn/src/main/jniLibs/arm64-v8a/libfptn_native_lib.so
    - name: Save pinned native library
      if: steps.native-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: out/fptn
        key: ${{ steps.native-cache.outputs.cache-primary-key }}
